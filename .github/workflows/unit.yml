name: Agent unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # the unit tests only need the sql path and the mcp server, not the full ml stack
      - name: Install focused test dependencies
        run: python -m pip install pytest build -e .
      - name: Run unit tests
        env:
          GROQ_API_KEY: ""
        run: python -m pytest -q tests/
      - name: Build sdist and wheel
        run: python -m build
